<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Allow inference?</title>
    <link rel="stylesheet" href="shared.css" />
    <link rel="stylesheet" href="approval.css" />
  </head>
  <body class="approval-body">
    <main class="approval">
      <div class="approval-scroll stack">
        <header>
          <div class="eyebrow approval-eyebrow">
            <span class="eyebrow-label">Permission request for</span>
            <span class="eyebrow-origin" id="origin">…</span>
          </div>
          <p class="hint">
            This site wants to send a chat request through Inference Bridge.
          </p>
        </header>

        <section class="panel stack">
          <h2>Provider / model</h2>
          <label class="field">
            <span>Provider</span>
            <select id="provider"></select>
            <p class="hint" id="providerHint" hidden></p>
          </label>
          <label class="field" id="modelField">
            <span>Model</span>
            <select id="modelSelect"></select>
            <div class="model-input-row" id="modelInputRow" hidden>
              <input
                id="modelInput"
                type="text"
                list="modelList"
                autocomplete="off"
                spellcheck="false"
                placeholder="Type to search models…"
              />
              <button
                type="button"
                id="clearModel"
                class="ghost"
                hidden
                aria-label="Clear model"
              >
                Clear
              </button>
            </div>
            <datalist id="modelList"></datalist>
            <p class="hint" id="modelHint" hidden></p>
          </label>
          <p class="capability-warning" id="capabilityWarning" hidden></p>
        </section>

        <section class="panel stack tools-panel" id="toolsPanel" hidden>
          <h2>Tools</h2>
          <ul class="tools-list" id="toolsList"></ul>
        </section>

        <section class="panel stack preview-panel">
          <h2>Request preview</h2>
          <div class="preview" id="preview" aria-live="polite"></div>
        </section>

        <p class="status err" id="error" hidden></p>
      </div>

      <div class="approval-footer">
        <label class="remember">
          <input type="checkbox" id="remember" />
          <span>Remember for this site</span>
        </label>
        <p class="hint remember-hint" id="rememberHint">
          Allow once, or deny only this request.
        </p>
        <div class="actions approval-actions">
          <button type="button" class="primary" id="allow" disabled>Allow</button>
          <button type="button" class="danger" id="deny">Deny</button>
        </div>
      </div>
    </main>
    <script type="module" src="approval.js"></script>
  </body>
</html>
